databases:
  - name: stockflow-db
    databaseName: stockflow
    user: stockflow_user
    plan: free

services:
  # Django REST API Backend
  - type: web
    name: stockflow-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # React Vite Frontend Static Site
  - type: web
    name: stockflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stockflow-backend.onrender.com
